spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lotolab}
spring.datasource.username=${DB_USER:lotolab}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}
gemini.api.fallback-url=${GEMINI_API_FALLBACK_URL:}
gemini.api.key=${GEMINI_API_KEY:}
lotolab.pattern-miner.cron=${LOTOLAB_PATTERN_MINER_CRON:0 0 3 * * *}
lotolab.pattern-miner.zone=${LOTOLAB_PATTERN_MINER_ZONE:America/Sao_Paulo}
lotolab.agents.gemini.enabled=${LOTOLAB_AGENTS_GEMINI_ENABLED:false}
lotolab.agents.worker.enabled=${LOTOLAB_AGENT_WORKER_ENABLED:true}
lotolab.agents.worker-delay-ms=${LOTOLAB_AGENT_WORKER_DELAY_MS:2000}
spring.task.scheduling.pool.size=2
lotolab.import.api-token=${LOTOLAB_IMPORT_TOKEN:}
lotolab.ml.worker.enabled=${LOTOLAB_ML_WORKER_ENABLED:true}
lotolab.ml.worker-delay-ms=${LOTOLAB_ML_WORKER_DELAY_MS:1000}
lotolab.ml.epochs=${LOTOLAB_ML_EPOCHS:200}
lotolab.ml.learning-rate=${LOTOLAB_ML_LEARNING_RATE:0.08}
lotolab.ml.l2=${LOTOLAB_ML_L2:0.10}
lotolab.ml.max-fit-ms=${LOTOLAB_ML_MAX_FIT_MS:20000}
lotolab.ml.min-training-contests=${LOTOLAB_ML_MIN_TRAINING_CONTESTS:30}
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Logs legiveis e correlacionaveis; os niveis das categorias LotoLab podem ser
# sobrescritos por variaveis LOGGING_LEVEL_BR_COM_LOTOLAB_*.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [trace=%X{correlationId:-}] [run=%X{runId:-}] [%X{component:-}] [%X{operation:-}] [%X{phase:-}] %msg%n
logging.level.br.com.lotolab=INFO
logging.level.br.com.lotolab.api=INFO
logging.level.br.com.lotolab.application=INFO
logging.level.br.com.lotolab.infrastructure.agent=INFO
logging.level.br.com.lotolab.infrastructure.gemini=INFO
logging.level.br.com.lotolab.infrastructure.persistence=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
