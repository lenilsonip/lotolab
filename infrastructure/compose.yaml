name: lotolab-publicacao
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lotolab_publicacao_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lotolab_publicacao_postgres_data:
    name: lotolab-publicacao-postgres-data